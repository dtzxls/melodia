name: Build IPA (unsigned)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no codesign)
        run: |
          xcodebuild -project Melodia.xcodeproj \
            -target Melodia \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Melodia.app Payload/
          zip -r -q Melodia-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melodia-unsigned-ipa
          path: Melodia-unsigned.ipa
          retention-days: 7
          if-no-files-found: error